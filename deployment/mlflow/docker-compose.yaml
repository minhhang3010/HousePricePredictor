services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.3.1
    container_name: mlflow-tracking-server
    ports:
      - "5555:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts

volumes:
  mlflow-data: